[project]
name = "docintel-pipeline"
version = "0.1.0"
description = "Local document intelligence pipeline: upload a document, get calculated answers, no cloud calls."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
]
